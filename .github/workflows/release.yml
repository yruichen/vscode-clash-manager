name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Package and release
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Verify tag matches package version
        run: node scripts/check-release-version.js "${GITHUB_REF_NAME}"

      - name: Install locked dependencies
        run: npm ci

      - name: Run verification suite
        run: npm test

      - name: Build VSIX
        run: npm run package:vsix

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" vscode-clash-manager.vsix --verify-tag --generate-notes --title "${GITHUB_REF_NAME}"
